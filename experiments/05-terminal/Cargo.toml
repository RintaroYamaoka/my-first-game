[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
# system_clipboard: ターミナルのコピーと貼り付けで、OS のクリップボードを使う
bevy = { workspace = true, features = ["system_clipboard"] }
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
serde_json = "1"
