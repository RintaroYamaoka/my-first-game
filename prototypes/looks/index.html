const SRC = `import { createServer } from "node:http";
import { parseFragment } from "./fragment";
import { store } from "./store";

const PORT = 8080;

export const server = createServer(async (req, res) => {
  const url = new URL(req.url ?? "/", "http://localhost");

  if (req.method === "POST" && url.pathname === "/fragments") {
    const body = await readBody(req);
    const fragment = parseFragment(body);
    if (!fragment.ok) {
      return send(res, 400, { error: fragment.reason });
    }
    const saved = await store.save(fragment.value);
    return send(res, 201, saved);
  }

  if (req.method === "GET" && url.pathname.startsWith("/fragments/")) {
    const id = Number(url.pathname.split("/")[2]);
    const rows = await store.findById(id);
    return send(res, 200, rows[0].payload);
  }

  return send(res, 404, { error: "not found" });
});

async function readBody(req) {
  const chunks = [];
  for await (const chunk of req) {
    chunks.push(chunk);
  }
  return Buffer.concat(chunks).toString("utf8");
}

function send(res, status, body) {
  res.writeHead(status, { "content-type": "application/json" });
  res.end(JSON.stringify(body));
}

}
const logEl = document.getElementById('log');
function tl(t, cls = '') { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; logEl.append(d); logEl.scrollTop = logEl.scrollHeight; }

// ---------- 文字だけの画面 ----------
const cardEl = document.getElementById('card'), cardMain = document.getElementById('cardMain'), cardSub = document.getElementById('cardSub');
const PAIRS = [['#0b0b0b', '#f2f2f2']]; let cardN = 0;
function card(main, sub, ms, small = false, pair = null) {
  const [bg, fg] = pair || PAIRS[cardN++ % PAIRS.length];
  cardEl.className = small ? 'small' : ''; cardEl.style.background = bg; cardEl.style.color = fg;
  cardMain.textContent = main; cardSub.textContent = sub || ''; cardEl.style.display = 'flex';
  return new Promise(r => setTimeout(() => { cardEl.style.display = 'none'; r(); }, ms));
}
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---------- 操作 ----------
let mode = 'dir', busy = false, zoom = 0, err = false;
function hud() {
  document.getElementById('mode').textContent = mode === 'dir' ? 'フォルダの世界' : 'コードの世界';
  document.getElementById('crumb').textContent = mode === 'dir' ? 'my-world /' : 'my-world / src / server.ts';
}
function applyErr() {
  mat.acc.color.set(err ? C.err : C.own); storeObj.userData.edges.material.color.set(err ? C.err : C.line);
  gapTile.visible = !err; rowsOk.visible = !err; rowsBad.visible = err;
}
async function dive() {
  if (busy) return; busy = true;
  if (mode === 'dir') {
    tl('$ $EDITOR src/server.ts', 'in'); zoom = 1; await wait(650);
    await card('src/server.ts', '48 LINES', 420);
    mode = 'code'; dirWorld.visible = false; codeWorld.visible = true; zoom = 0; resetRide();
  } else {
    await card('src/', 'CLOSE', 360); tl('$ ls src', 'in'); tl('db  fragment.ts  routes  server.ts  store.ts');
    mode = 'dir'; dirWorld.visible = true; codeWorld.visible = false;
  }
  hud(); renderEditor(); busy = false;
}
async function toggleErr() {
  if (busy) return; busy = true; err = !err; tl('$ curl -i localhost:8080/fragments/7', 'in');
  if (err) {
    await card('500', 'INTERNAL SERVER ERROR', 520, false, ['#0b0b0b', '#e2231a']);
    tl('HTTP/1.1 500 Internal Server Error', 'err');
    tl("TypeError: Cannot read properties of undefined (reading 'payload')", 'err'); tl('    at Server.<anonymous> (src/server.ts:23:36)', 'err');
  } else { tl('HTTP/1.1 200 OK', 'ok'); }
  applyErr(); if (mode === 'code') resetRide(); renderEditor(); busy = false;
}
const COMMITS = ['a3f91c2  断片の型を定義する', '4be07d1  検査を追加する', '9c2e5aa  空の payload を拒否する', 'e18b3f0  保存の処理を分ける',
  '71d4c9e  DB につなぐ', '0fa62b7  取得の問い合わせを書く', 'c5539d4  テストを足す', '83c1d0a  TODO: 復元を試す', '5d20a18  デプロイの手順を書く'];
async function montage() {
  if (busy) return; busy = true; tl('$ git log --oneline', 'in');
  for (const c of COMMITS) { tl(c, 'dim'); await card(c, '', 620, true); await wait(110); }   // 読める速さ
  busy = false;
}
addEventListener('keydown', e => { if (e.key === 'Enter') dive(); else if (/^e$/i.test(e.key)) toggleErr(); else if (/^g$/i.test(e.key)) montage(); });

// ---------- ループ ----------
const clock = new THREE.Clock(); let T = 0; const look = new V3(0, 26, -70), pos = new V3(0, 10, 70);
function frame() {
  const dt = Math.min(clock.getDelta(), .05); T += dt;
  if (mode === 'dir') {
    const rest = new V3(Math.sin(T * .17) * 6, 10 + Math.sin(T * .11) * 1.2, 70), tgt = new V3(serverTs.x, 13, serverTs.z + 10);
    pos.lerp(zoom ? tgt : rest, zoom ? .1 : .05); look.lerp(zoom ? new V3(serverTs.x, 10, serverTs.z) : new V3(0, 24, -70), zoom ? .1 : .05);
    camera.fov += ((zoom ? 26 : 50) - camera.fov) * .1;
  } else {
    ride(dt); pos.copy(rpos); look.lerp(rlook, .09); camera.fov += (64 - camera.fov) * .1;
  }
  camera.position.copy(pos); camera.lookAt(look); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize(); hud(); renderEditor(); applyErr();
tl('$ ls', 'in'); tl('README.md  node_modules  package-lock.json  package.json  scripts  src  tests  tsconfig.json');
tl('(この試作のターミナルは表示だけです。操作は上のキーで行います)', 'dim');
window.__v = { dive, toggleErr, montage, state: () => ({ mode, busy, err }) };
frame();
</script>
